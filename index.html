<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- Metadatos Open Graph para vista previa limpia al compartir por WhatsApp -->
  <meta property="og:title" content="Recuerdos en Movimiento">
  <meta property="og:description"
    content="Toca para abrir esta película interactiva de recuerdos, música y emociones compartidas.">
  <meta property="og:type" content="website">

  <title>Experiencia Cinematográfica de Recuerdos</title>
  <style>
    /* ==========================================================================
       1. VARIABLES DE DISEÑO Y RESET MOBILE-FIRST (WHATSAPP / iOS / ANDROID)
       ========================================================================== */
    :root {
      --bg-void: #08080a;
      --bg-sheet: #111116;
      --bg-glass: rgba(18, 18, 24, 0.72);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-gold: rgba(229, 195, 139, 0.42);
      --text-primary: #f6f3ed;
      --text-secondary: rgba(246, 243, 237, 0.75);
      --text-muted: rgba(246, 243, 237, 0.48);
      --accent-gold: #e5c38b;
      --accent-warm: #f5dcb0;
      --font-serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --ease-cinema: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html,
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. CAPAS ATMOSFÉRICAS (PARTÍCULAS CANVAS, GRANO SVG, LIGHT LEAKS, VIÑETA)
       ========================================================================== */
    #particlesCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 24;
    }

    /* Grano de película de 35mm mediante SVG nativo */
    .film-grain-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 23;
      opacity: 0.045;
      mix-blend-mode: overlay;
    }

    .cinema-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 16;
      background:
        radial-gradient(circle at 50% 42%, transparent 40%, rgba(5, 5, 8, 0.74) 100%),
        linear-gradient(180deg, rgba(6, 6, 9, 0.62) 0%, transparent 22%, transparent 52%, rgba(6, 6, 9, 0.92) 100%);
    }

    .light-leak {
      position: fixed;
      inset: -18%;
      pointer-events: none;
      z-index: 15;
      opacity: 0.28;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at 20% 24%, rgba(235, 182, 114, 0.36), transparent 56%),
        radial-gradient(ellipse at 82% 76%, rgba(196, 134, 96, 0.26), transparent 52%);
      animation: leakDrift 16s ease-in-out infinite alternate;
      transition: opacity 0.5s ease;
    }

    @keyframes leakDrift {
      0% {
        transform: translate3d(-3%, -2%, 0) scale(1);
      }

      50% {
        transform: translate3d(2%, 3%, 0) scale(1.06);
      }

      100% {
        transform: translate3d(-1%, 3%, 0) scale(1.02);
      }
    }

    /* ==========================================================================
       3. PANTALLA INICIAL INMERSIVA (OPTIMIZADA PARA VERTICAL MÓVIL)
       ========================================================================== */
    .intro-screen {
      display: none !important;
    }

    .intro-screen.hidden {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .intro-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUpSlow 1.3s var(--ease-cinema) 0.15s forwards;
    }

    .intro-title {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(2rem, 8.2vw, 3.9rem);
      line-height: 1.15;
      max-width: 15ch;
      color: var(--text-primary);
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
      opacity: 0;
      animation: fadeUpSlow 1.5s var(--ease-cinema) 0.35s forwards;
    }

    .intro-divider {
      width: 56px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      margin: 1.4rem auto;
      opacity: 0;
      animation: fadeUpSlow 1.5s var(--ease-cinema) 0.55s forwards;
    }

    .intro-subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(0.98rem, 3.9vw, 1.18rem);
      color: var(--text-secondary);
      max-width: 34ch;
      line-height: 1.58;
      margin-bottom: 2.3rem;
      opacity: 0;
      animation: fadeUpSlow 1.5s var(--ease-cinema) 0.75s forwards;
    }

    .intro-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      gap: 0.9rem;
      opacity: 0;
      animation: fadeUpSlow 1.5s var(--ease-cinema) 0.95s forwards;
    }

    .btn-cinema-start {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.95rem 1.8rem;
      border-radius: 999px;
      border: 1px solid var(--border-gold);
      background: linear-gradient(135deg, rgba(229, 195, 139, 0.24), rgba(229, 195, 139, 0.08));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-primary);
      font-family: var(--font-serif);
      font-size: 1.06rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: transform 0.35s var(--ease-cinema), box-shadow 0.35s, border-color 0.35s;
    }

    .btn-cinema-start:active {
      transform: scale(0.97);
    }

    .btn-secondary-ghost {
      width: 100%;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-secondary-ghost:active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    @keyframes fadeUpSlow {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       4. ESCENARIO CINEMATOGRÁFICO (CROSSFADE, KEN BURNS Y BACKDROP BLUR)
       ========================================================================== */
    .cinema-stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      z-index: 5;
      background: var(--bg-void);
      touch-action: pan-y;
    }

    .scene-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.7s ease-in-out, visibility 1.7s;
      will-change: opacity;
    }

    .scene-layer.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .scene-layer.previous {
      opacity: 0;
      visibility: visible;
      z-index: 1;
    }

    /* Fondo ampliado y desenfocado para adaptar fotos horizontales en vertical (y viceversa) */
    .scene-backdrop {
      position: absolute;
      inset: -14%;
      width: 128%;
      height: 128%;
      object-fit: cover;
      filter: blur(26px) brightness(0.42) saturate(1.18);
      transform: scale(1.12);
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }

    .scene-layer.needs-backdrop .scene-backdrop {
      opacity: 1;
    }

    .ken-burns-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    .scene-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Encuadre elegante sin recortes bruscos cuando difiere la orientación */
    .scene-layer.needs-backdrop .scene-photo {
      width: auto;
      height: auto;
      max-width: 92vw;
      max-height: 76dvh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    /* ==========================================================================
       5. NARRATIVA EMOCIONAL (FRASES POÉTICAS LEGIBLES)
       ========================================================================== */
    .narrative-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(6.2rem + var(--safe-bottom));
      z-index: 26;
      padding: 0 clamp(1.25rem, 6vw, 3.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      transition: transform 0.55s var(--ease-cinema);
    }

    body.controls-hidden .narrative-overlay {
      transform: translateY(2.6rem);
    }

    .narrative-chapter {
      display: none !important;
    }

    .narrative-quote {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(1.2rem, 4.8vw, 2.05rem);
      line-height: 1.42;
      color: var(--text-primary);
      max-width: 32ch;
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 0.98);
    }

    .narrative-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(3px);
      transition: opacity 0.85s ease, transform 0.85s var(--ease-cinema), filter 0.85s ease;
      margin-right: 0.27em;
    }

    .narrative-word.revealed {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    /* ==========================================================================
       6. BARRA SUPERIOR MINIMALISTA (CONTADOR, SONIDO, ESTUDIO, PANTALLA COMPLETA)
       ========================================================================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 36;
      padding: calc(0.75rem + var(--safe-top)) clamp(0.85rem, 3.5vw, 1.5rem) 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s var(--ease-cinema);
    }

    body.controls-hidden .top-bar {
      opacity: 0;
      transform: translateY(-10px);
    }

    .scene-counter-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-serif);
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      color: var(--text-primary);
    }

    .equalizer-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
    }

    .equalizer-bars span {
      width: 2px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent-gold);
    }

    .equalizer-bars.playing span:nth-child(1) {
      animation: eqPulse 0.85s ease-in-out infinite alternate;
    }

    .equalizer-bars.playing span:nth-child(2) {
      animation: eqPulse 0.6s ease-in-out 0.2s infinite alternate;
    }

    .equalizer-bars.playing span:nth-child(3) {
      animation: eqPulse 1.05s ease-in-out 0.35s infinite alternate;
    }

    @keyframes eqPulse {
      from {
        height: 3px;
      }

      to {
        height: 11px;
      }
    }

    .top-actions-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .icon-pill-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }

    .icon-pill-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.14);
      color: var(--accent-warm);
    }

    /* ==========================================================================
       7. BARRA INFERIOR TÁCTIL (PROGRESO CONTINUO + CONTROLES DE PULGAR)
       ========================================================================== */
    .bottom-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 36;
      padding: 0.6rem clamp(1rem, 4vw, 2rem) calc(0.95rem + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      background: linear-gradient(180deg, transparent 0%, rgba(8, 8, 10, 0.85) 100%);
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s var(--ease-cinema);
    }

    body.controls-hidden .bottom-dock {
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
    }

    .continuous-progress-track {
      width: 100%;
      max-width: 560px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .continuous-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-gold), var(--accent-warm));
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(229, 195, 139, 0.75);
      transition: width 0.12s linear;
    }

    .thumb-transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
    }

    .transport-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .transport-btn.play-main {
      width: 56px;
      height: 56px;
      border-color: var(--border-gold);
      background: rgba(229, 195, 139, 0.2);
      color: var(--accent-warm);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .transport-btn:active {
      transform: scale(0.91);
    }

    /* ==========================================================================
       8. PANTALLA FINAL EMOTIVA
       ========================================================================== */
    .finale-screen {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1.5rem + var(--safe-top)) 1.5rem calc(1.75rem + var(--safe-bottom));
      text-align: center;
      opacity: 0;
      visibility: hidden;
      background: radial-gradient(circle at center, rgba(14, 13, 18, 0.62) 0%, rgba(6, 6, 8, 0.94) 100%);
      transition: opacity 1.6s var(--ease-cinema), visibility 1.6s;
    }

    .finale-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    .finale-photo-frame {
      width: min(280px, 72vw);
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.75rem;
      border: 1px solid var(--border-gold);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 36px rgba(229, 195, 139, 0.16);
    }

    .finale-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: finaleSlowZoom 20s ease-in-out infinite alternate;
    }

    @keyframes finaleSlowZoom {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.16);
      }
    }

    .finale-message {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(1.45rem, 5.4vw, 2.5rem);
      line-height: 1.35;
      max-width: 22ch;
      color: var(--text-primary);
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.9);
      margin-bottom: 0.75rem;
    }

    .finale-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.98rem;
      color: var(--accent-gold);
      margin-bottom: 2rem;
    }

    .finale-actions {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 310px;
      gap: 0.8rem;
    }

    /* ==========================================================================
       9. ESTUDIO DE PERSONALIZACIÓN (BOTTOM SHEET MOBILE-FRIENDLY)
       ========================================================================== */
    .studio-modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(5, 5, 8, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
    }

    @media (min-width: 640px) {
      .studio-modal {
        align-items: center;
        padding: 1.5rem;
      }
    }

    .studio-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .studio-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 90dvh;
      background: var(--bg-sheet);
      border-top: 1px solid var(--border-subtle);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(24px);
      transition: transform 0.38s var(--ease-cinema);
      box-shadow: 0 -18px 60px rgba(0, 0, 0, 0.85);
    }

    @media (min-width: 640px) {
      .studio-sheet {
        border: 1px solid var(--border-subtle);
        border-radius: 22px;
      }
    }

    .studio-modal.open .studio-sheet {
      transform: translateY(0);
    }

    .sheet-drag-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      margin: 0.65rem auto 0.15rem;
      flex-shrink: 0;
    }

    .studio-header {
      padding: 0.75rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .studio-header h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 1.2rem;
      color: var(--accent-warm);
    }

    .studio-body {
      padding: 1.1rem 1.25rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .studio-upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    @media (max-width: 420px) {
      .studio-upload-grid {
        grid-template-columns: 1fr;
      }
    }

    .upload-tile {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 0.9rem;
      border-radius: 12px;
      border: 1px dashed var(--border-gold);
      background: rgba(229, 195, 139, 0.07);
      color: var(--text-primary);
      font-size: 0.85rem;
      text-align: center;
      cursor: pointer;
    }

    .studio-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .studio-label {
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .studio-input {
      width: 100%;
      min-height: 42px;
      padding: 0.55rem 0.8rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    .studio-input:focus {
      border-color: var(--accent-gold);
    }

    .scenes-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .scene-card-edit {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scene-card-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;

      /* --------------------------------------------------------------------------
         1. GENERADOR DE ESCENAS ARTÍSTICAS PICTÓRICAS (RESPALDO 100% AUTÓNOMO)
         -------------------------------------------------------------------------- */
      function createCinematicArtwork(preset) {
        const canvas = document.createElement('canvas');
        const isPortrait = preset.orientation === 'portrait';
        canvas.width = isPortrait ? 1080 : 1600;
        canvas.height = isPortrait ? 1560 : 1000;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        const skyGrad = ctx.createLinearGradient(0, 0, w * 0.25, h);
        preset.palette.forEach((color, idx) => {
          skyGrad.addColorStop(idx / (preset.palette.length - 1), color);
        });
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        const sunX = w * preset.lightPos[0];
        const sunY = h * preset.lightPos[1];
        const sunRadius = Math.min(w, h) * 0.35;
        const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, sunRadius);
        glow.addColorStop(0, 'rgba(255, 246, 224, 0.95)');
        glow.addColorStop(0.24, preset.glowColor);
        glow.addColorStop(0.66, 'rgba(229, 175, 112, 0.14)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 60; i++) {
          const sx = ((i * 733) % 1000) / 1000 * w;
          const sy = ((i * 397) % 1000) / 1000 * (h * 0.56);
          const sr = (i % 3 === 0) ? 2.0 : 1.1;
          ctx.fillStyle = `rgba(255, 248, 232, ${0.14 + (i % 5) * 0.08})`;
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let l = 0; l < 4; l++) {
          const baseH = h * (0.54 + l * 0.11);
          const amp = h * (0.085 - l * 0.014);
          ctx.beginPath();
          ctx.moveTo(0, h);
          for (let x = 0; x <= w; x += 24) {
            const nx = x / w;
            const wave =
              Math.sin(nx * (3.2 + l * 1.4) + preset.seed + l) * amp +
              Math.cos(nx * (7.5 - l) + preset.seed * 1.7) * (amp * 0.42);
            ctx.lineTo(x, baseH + wave);
          }
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fillStyle = preset.mountainColors[l];
          ctx.fill();
        }

        if (preset.waterReflection) {
          const waterY = h * 0.72;
          const waterGrad = ctx.createLinearGradient(0, waterY, 0, h);
          waterGrad.addColorStop(0, 'rgba(18, 22, 32, 0.72)');
          waterGrad.addColorStop(1, 'rgba(8, 9, 14, 0.96)');
          ctx.fillStyle = waterGrad;
          ctx.fillRect(0, waterY, w, h - waterY);

          for (let r = 0; r < 32; r++) {
            const ry = waterY + (r / 32) * (h - waterY);
            const rw = (1 - r / 36) * (w * 0.24) * (0.4 + Math.sin(r * 1.9) * 0.3);
            ctx.fillStyle = `rgba(255, 230, 185, ${0.25 - (r / 32) * 0.19})`;
            ctx.fillRect(sunX - rw / 2 + Math.sin(r * 3) * 14, ry, rw, 2.2);
          }
        }

        const figX = w * 0.5;
        const figY = h * 0.84;
        ctx.fillStyle = '#08070b';
        ctx.beginPath();
        ctx.ellipse(figX, h * 0.94, w * 0.36, h * 0.13, 0, Math.PI, 0);
        ctx.fill();

        const sc = Math.min(w, h) * 0.085;
        ctx.beginPath();
        ctx.arc(figX - sc * 0.24, figY - sc * 1.35, sc * 0.19, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(figX - sc * 0.45, figY - sc * 1.12, sc * 0.42, sc * 1.15, sc * 0.18);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(figX + sc * 0.2, figY - sc * 1.26, sc * 0.175, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(figX - sc * 0.02, figY - sc * 1.05, sc * 0.39, sc * 1.08, sc * 0.17);
        ctx.fill();

        return canvas.toDataURL('image/jpeg', 0.9);
      }

      class CinematicAudioEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.analyser = null;
          this.dataArray = null;
          this.isSynthRunning = false;
          this.chordTimer = null;
          this.chordStep = 0;
          this.customAudioEl = null;
          this.customSourceNode = null;
          this.usingCustomFile = false;
        }

        initContext() {
          if (this.ctx) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(state.isMuted ? 0 : state.volume, this.ctx.currentTime);

          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 64;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.masterGain.connect(this.analyser);
          this.analyser.connect(this.ctx.destination);
        }

        async start() {
          try {
            this.initContext();
            if (this.ctx && this.ctx.state === 'suspended') {
              await this.ctx.resume().catch(() => { });
            }
            if (this.usingCustomFile && this.customAudioEl) {
              this.stopSynth();
              this.customAudioEl.play().catch(() => { });
            } else if (!this.isSynthRunning) {
              this.startSynth();
            }
            this.updateEqualizerUI(this.ctx && this.ctx.state === 'running' && !state.isMuted);
          } catch (e) { }
        }

        pause() {
          if (this.usingCustomFile && this.customAudioEl) {
            this.customAudioEl.pause();
          }
          if (this.ctx && this.ctx.state === 'running' && !this.usingCustomFile) {
            this.ctx.suspend();
          }
          this.updateEqualizerUI(false);
        }

        setMuted(muted) {
          state.isMuted = muted;
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setTargetAtTime(muted ? 0 : state.volume, this.ctx.currentTime, 0.08);
          }
          if (this.customAudioEl) {
            this.customAudioEl.volume = muted ? 0 : state.volume;
          }
        }

        loadCustomAudioFile(file) {
          this.initContext();
          this.stopSynth();
          if (this.customAudioEl) {
            this.customAudioEl.pause();
            URL.revokeObjectURL(this.customAudioEl.src);
          }
          const url = URL.createObjectURL(file);
          this.customAudioEl = new Audio(url);
          this.customAudioEl.loop = true;
          this.customAudioEl.volume = state.isMuted ? 0 : state.volume;

          try {
            this.customSourceNode = this.ctx.createMediaElementSource(this.customAudioEl);
            this.customSourceNode.connect(this.masterGain);
          } catch (_) { }

          this.usingCustomFile = true;
          if (state.isPlaying) {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            this.customAudioEl.play().catch(() => { });
          }
        }

        startSynth() {
          if (this.isSynthRunning) return;
          this.isSynthRunning = true;

          const chords = [
            [174.61, 220.00, 261.63, 329.63, 523.25], // Fmaj7
            [146.83, 220.00, 261.63, 329.63, 440.00], // Dm9
            [116.54, 174.61, 220.00, 293.66, 440.00], // Bbmaj7
            [130.81, 196.00, 261.63, 349.23, 392.00]  // Csus4
          ];

          const playChord = () => {
            if (!this.isSynthRunning || !this.ctx) return;
            const now = this.ctx.currentTime;
            const freqs = chords[this.chordStep % chords.length];
            this.chordStep++;

            freqs.forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const subOsc = this.ctx.createOscillator();
              const filter = this.ctx.createBiquadFilter();
              const env = this.ctx.createGain();

              osc.type = idx === 0 ? 'sine' : 'triangle';
              subOsc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);
              subOsc.frequency.setValueAtTime(freq * 1.002, now);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(660 + idx * 130, now);

              const peakGain = idx === 0 ? 0.11 : 0.048;
              const delay = idx * 0.28;
              env.gain.setValueAtTime(0.0001, now + delay);
              env.gain.linearRampToValueAtTime(peakGain, now + delay + 1.5);
              env.gain.exponentialRampToValueAtTime(0.0001, now + delay + 5.6);

              osc.connect(filter);
              subOsc.connect(filter);
              filter.connect(env);
              env.connect(this.masterGain);

              osc.start(now + delay);
              subOsc.start(now + delay);
              osc.stop(now + delay + 5.8);
              subOsc.stop(now + delay + 5.8);
            });
          };

          playChord();
          this.chordTimer = setInterval(playChord, 4600);
        }

        stopSynth() {
          this.isSynthRunning = false;
          if (this.chordTimer) {
            clearInterval(this.chordTimer);
            this.chordTimer = null;
          }
        }

        getAudioEnergy() {
          if (!this.analyser || !this.dataArray || !state.isPlaying || state.isMuted) return 0;
          this.analyser.getByteFrequencyData(this.dataArray);
          let sum = 0;
          for (let i = 0; i < 12; i++) sum += this.dataArray[i];
          return sum / (12 * 255);
        }

        updateEqualizerUI(active) {
          const bars = document.getElementById('equalizerBars');
          bars.classList.toggle('playing', Boolean(active && !state.isMuted));
        }
      }

      const audioEngine = new CinematicAudioEngine();

      /* --------------------------------------------------------------------------
         4. PARTÍCULAS LUMINOSAS DORADAS EN CANVAS (60 FPS)
         -------------------------------------------------------------------------- */
      const particlesCanvas = document.getElementById('particlesCanvas');
      const pCtx = particlesCanvas.getContext('2d');
      let particles = [];

      function getViewportSize() {
        const vv = window.visualViewport;
        return {
          w: vv ? vv.width : window.innerWidth,
          h: vv ? vv.height : window.innerHeight
        };
      }

      function resizeParticlesCanvas() {
        const { w, h } = getViewportSize();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        particlesCanvas.width = w * dpr;
        particlesCanvas.height = h * dpr;
        pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function initParticles() {
        resizeParticlesCanvas();
        const { w, h } = getViewportSize();
        const count = w < 600 ? 36 : 58;
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          radius: 0.8 + Math.random() * 2.1,
          vx: (Math.random() - 0.5) * 0.24,
          vy: -0.16 - Math.random() * 0.34,
          alpha: 0.16 + Math.random() * 0.55,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function renderParticles(time, audioEnergy) {
        const { w, h } = getViewportSize();
        pCtx.clearRect(0, 0, w, h);
        const boost = state.isFinished ? 1.75 : (1 + audioEnergy * 1.4);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx + Math.sin(time * 0.0008 + p.phase) * 0.16;
          p.y += p.vy * (state.isFinished ? 1.45 : 1);

          if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          const twinkle = 0.65 + 0.35 * Math.sin(time * 0.002 + p.phase);
          const alpha = Math.min(0.95, p.alpha * twinkle * boost);

          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.radius * (1 + audioEnergy * 0.4), 0, Math.PI * 2);
          pCtx.fillStyle = `rgba(245, 220, 176, ${alpha})`;
          pCtx.fill();
        }
      }

      /* --------------------------------------------------------------------------
         5. ESCENARIO CINEMATOGRÁFICO, KEN BURNS Y ADAPTACIÓN DE ORIENTACIÓN
         -------------------------------------------------------------------------- */
      const cinemaStage = document.getElementById('cinemaStage');
      const progressFill = document.getElementById('progressFill');
      const progressTrack = document.getElementById('progressTrack');
      const sceneCounter = document.getElementById('sceneCounter');
      const narrativeChapter = document.getElementById('narrativeChapter');
      const narrativeQuote = document.getElementById('narrativeQuote');
      const lightLeak = document.getElementById('lightLeak');

      function evaluateAspectAdaptation(imgEl, layerEl) {
        if (!imgEl.naturalWidth || !imgEl.naturalHeight) return;
        const { w, h } = getViewportSize();
        const imgRatio = imgEl.naturalWidth / imgEl.naturalHeight;
        const screenRatio = w / h;
        const ratioDiff = Math.abs(Math.log(imgRatio / screenRatio));

        // Activa fondo ampliado y desenfocado si una foto horizontal se ve en móvil vertical (o viceversa)
        layerEl.classList.toggle('needs-backdrop', ratioDiff > 0.45);
      }

      function buildStageDOM() {
        cinemaStage.innerHTML = '';
        state.scenes.forEach((scene, index) => {
          const layer = document.createElement('div');
          layer.className = 'scene-layer';
          layer.dataset.index = index;

          const backdrop = document.createElement('img');
          backdrop.className = 'scene-backdrop';
          backdrop.src = scene.src;
          backdrop.alt = '';

          const kbWrapper = document.createElement('div');
          kbWrapper.className = 'ken-burns-wrapper';

          const photo = document.createElement('img');
          photo.className = 'scene-photo';
          photo.src = scene.src;
          photo.alt = scene.quote || `Recuerdo ${index + 1}`;
          photo.onload = () => evaluateAspectAdaptation(photo, layer);

          kbWrapper.appendChild(photo);
          layer.appendChild(backdrop);
          layer.appendChild(kbWrapper);
          cinemaStage.appendChild(layer);
        });
      }

      function triggerNarrativeAnimation(scene) {
        state.wordTimers.forEach(t => clearTimeout(t));
        state.wordTimers = [];

        narrativeChapter.classList.remove('visible');
        narrativeQuote.innerHTML = '';

        const words = (scene.quote || '').trim().split(/\s+/).filter(Boolean);
        words.forEach((word) => {
          const span = document.createElement('span');
          span.className = 'narrative-word';
          span.textContent = word;
          narrativeQuote.appendChild(span);
        });

        narrativeQuote.querySelectorAll('.narrative-word').forEach((span, idx) => {
          state.wordTimers.push(setTimeout(() => {
            span.classList.add('revealed');
          }, 520 + idx * 125));
        });
      }

      function goToScene(index, resetElapsed = true) {
        if (!state.scenes.length) return;
        if (index >= state.scenes.length) {
          showFinale();
          return;
        }

        const clampedIndex = Math.max(0, index);
        const prevIndex = state.currentIndex;
        state.currentIndex = clampedIndex;
        if (resetElapsed) state.sceneElapsed = 0;

        cinemaStage.querySelectorAll('.scene-layer').forEach((layer, idx) => {
          layer.classList.remove('active', 'previous');
          if (idx === clampedIndex) layer.classList.add('active');
          else if (idx === prevIndex && prevIndex !== clampedIndex) layer.classList.add('previous');
        });

        const curStr = String(clampedIndex + 1).padStart(2, '0');
        const totStr = String(state.scenes.length).padStart(2, '0');
        sceneCounter.textContent = `${curStr} / ${totStr}`;

        triggerNarrativeAnimation(state.scenes[clampedIndex]);
        updateProgressUI();
      }

      function updateProgressUI() {
        const totalDuration = state.scenes.reduce((acc, s) => acc + s.duration, 0);
        if (!totalDuration) return;
        const completedBefore = state.scenes
          .slice(0, state.currentIndex)
          .reduce((acc, s) => acc + s.duration, 0);
        const pct = Math.min(100, ((completedBefore + state.sceneElapsed) / totalDuration) * 100);
        progressFill.style.width = `${pct.toFixed(2)}%`;
        progressTrack.setAttribute('aria-valuenow', Math.round(pct));
      }

      function updateKenBurnsFrame() {
        const activeLayer = cinemaStage.querySelector('.scene-layer.active');
        if (!activeLayer) return;
        const scene = state.scenes[state.currentIndex];
        if (!scene) return;

        const progress = Math.min(1, state.sceneElapsed / scene.duration);
        const ease = -(Math.cos(Math.PI * progress) - 1) / 2;
        const kb = scene.kenBurns;

        const scale = kb.startScale + (kb.endScale - kb.startScale) * ease;
        const tx = kb.startX + (kb.endX - kb.startX) * ease;
        const ty = kb.startY + (kb.endY - kb.startY) * ease;

        const wrapper = activeLayer.querySelector('.ken-burns-wrapper');
        if (wrapper) {
          wrapper.style.transform = `scale(${scale.toFixed(4)}) translate3d(${tx.toFixed(2)}%, ${ty.toFixed(2)}%, 0)`;
        }
        updateProgressUI();
      }

      /* --------------------------------------------------------------------------
         6. BUCLE DE ANIMACIÓN Y CONTROL DE ESTADOS
         -------------------------------------------------------------------------- */
      function mainLoop(timestamp) {
        if (!state.lastFrameTime) state.lastFrameTime = timestamp;
        const dt = (timestamp - state.lastFrameTime) / 1000;
        state.lastFrameTime = timestamp;

        const energy = audioEngine.getAudioEnergy();
        renderParticles(timestamp, energy);

        if (state.isPlaying && !state.isMuted) {
          lightLeak.style.opacity = (0.24 + energy * 0.34).toFixed(2);
        }

        if (state.isPlaying && !state.isFinished && state.scenes.length > 0) {
          state.sceneElapsed += dt;
          const currentScene = state.scenes[state.currentIndex];
          updateKenBurnsFrame();

          if (state.sceneElapsed >= currentScene.duration) {
            goToScene(state.currentIndex + 1, true);
          }
        }

        requestAnimationFrame(mainLoop);
      }

      function setPlayingState(play) {
        state.isPlaying = play;
        document.getElementById('iconPause').style.display = play ? 'block' : 'none';
        document.getElementById('iconPlay').style.display = play ? 'none' : 'block';

        if (play) {
          audioEngine.start();
          resetControlsAutoHide();
        } else {
          audioEngine.pause();
          showControls();
        }
      }

      function startExperience() {
        state.hasStarted = true;
        state.isFinished = false;
        const intro = document.getElementById('introScreen');
        if (intro) {
          intro.classList.add('hidden');
          intro.style.display = 'none';
        }
        const finale = document.getElementById('finaleScreen');
        if (finale) {
          finale.classList.remove('visible');
          finale.setAttribute('aria-hidden', 'true');
        }

        goToScene(0, true);
        setPlayingState(true);
      }

      function showFinale() {
        state.isFinished = true;
        state.isPlaying = false;
        document.body.classList.remove('controls-hidden');
        progressFill.style.width = '100%';

        const lastScene = state.scenes[state.scenes.length - 1];
        const featuredEl = document.getElementById('finaleFeaturedImg');
        if (featuredEl) {
          featuredEl.src = 'init.jpeg';
        }
        document.getElementById('finaleMessageText').textContent = state.finaleMessage;

        const finaleEl = document.getElementById('finaleScreen');
        finaleEl.classList.add('visible');
        finaleEl.setAttribute('aria-hidden', 'false');
      }

      /* --------------------------------------------------------------------------
         7. AUTO-OCULTAMIENTO DE CONTROLES Y GESTOS TÁCTILES (SWIPE + TAP)
         -------------------------------------------------------------------------- */
      function showControls() {
        document.body.classList.remove('controls-hidden');
        resetControlsAutoHide();
      }

      function resetControlsAutoHide() {
        if (state.inactivityTimer) clearTimeout(state.inactivityTimer);
        if (!state.isPlaying || state.isFinished) return;

        state.inactivityTimer = setTimeout(() => {
          const modal = document.getElementById('studioModal');
          if (state.isPlaying && (!modal || !modal.classList.contains('open'))) {
            document.body.classList.add('controls-hidden');
          }
        }, 3500);
      }

      let touchStartX = 0;
      let touchStartY = 0;

      cinemaStage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        showControls();
      }, { passive: true });

      cinemaStage.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) goToScene(state.currentIndex + 1);
          else goToScene(state.currentIndex - 1);
        }
      }, { passive: true });

      cinemaStage.addEventListener('click', () => {
        if (state.hasStarted && !state.isFinished) {
          if (document.body.classList.contains('controls-hidden')) showControls();
          else document.body.classList.add('controls-hidden');
        }
      });

      progressTrack.addEventListener('click', (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const targetIndex = Math.min(state.scenes.length - 1, Math.floor(clickRatio * state.scenes.length));
        goToScene(targetIndex, true);
      });

      /* --------------------------------------------------------------------------
         8. ESTUDIO DE PERSONALIZACIÓN (REORDENAR, SUBIR GALERÍA, EDITAR TEXTOS)
         -------------------------------------------------------------------------- */
      const studioModal = document.getElementById('studioModal');
      const scenesEditorList = document.getElementById('scenesEditorList');

      function openStudio() {
        if (!studioModal) return;
        if (state.isPlaying) setPlayingState(false);
        const storyEl = document.getElementById('inputStoryTitle');
        if (storyEl) storyEl.value = state.storyTitle;
        const finEl = document.getElementById('inputFinaleMessage');
        if (finEl) finEl.value = state.finaleMessage;
        renderStudioScenesList();
        studioModal.classList.add('open');
      }

      function closeStudio() {
        if (studioModal) studioModal.classList.remove('open');
      }

      function renderStudioScenesList() {
        if (!scenesEditorList) return;
        scenesEditorList.innerHTML = '';
        state.scenes.forEach((scene, idx) => {
          const card = document.createElement('div');
          card.className = 'scene-card-edit';

          const thumb = document.createElement('img');
          thumb.className = 'scene-card-thumb';
          thumb.src = scene.src;
          thumb.alt = `Escena ${idx + 1}`;

          const inputsCol = document.createElement('div');
          inputsCol.className = 'scene-card-inputs';

          const quoteInput = document.createElement('input');
          quoteInput.type = 'text';
          quoteInput.className = 'studio-input';
          quoteInput.placeholder = 'Frase emotiva...';
          quoteInput.value = scene.quote;
          quoteInput.addEventListener('input', (e) => { state.scenes[idx].quote = e.target.value; });

          const subRow = document.createElement('div');
          subRow.className = 'scene-card-subrow';

          const chapInput = document.createElement('input');
          chapInput.type = 'text';
          chapInput.className = 'studio-input';
          chapInput.placeholder = 'Capítulo o fecha';
          chapInput.value = scene.chapter || '';
          chapInput.addEventListener('input', (e) => { state.scenes[idx].chapter = e.target.value; });

          const durInput = document.createElement('input');
          durInput.type = 'number';
          durInput.className = 'studio-input';
          durInput.min = '3';
          durInput.max = '25';
          durInput.step = '0.5';
          durInput.title = 'Segundos';
          durInput.value = scene.duration;
          durInput.addEventListener('change', (e) => {
            const v = parseFloat(e.target.value);
            state.scenes[idx].duration = isNaN(v) ? 6 : Math.min(25, Math.max(3, v));
          });

          subRow.appendChild(chapInput);
          subRow.appendChild(durInput);
          inputsCol.appendChild(quoteInput);
          inputsCol.appendChild(subRow);

          const actionsCol = document.createElement('div');
          actionsCol.className = 'scene-card-actions';

          const upBtn = document.createElement('button');
          upBtn.className = 'mini-action-btn';
          upBtn.title = 'Subir escena';
          upBtn.innerHTML = '&#8593;';
          upBtn.disabled = idx === 0;
          upBtn.addEventListener('click', () => {
            if (idx === 0) return;
            [state.scenes[idx - 1], state.scenes[idx]] = [state.scenes[idx], state.scenes[idx - 1]];
            renderStudioScenesList();
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'mini-action-btn danger';
          delBtn.title = 'Eliminar escena';
          delBtn.innerHTML = '&times;';
          delBtn.addEventListener('click', () => {
            if (state.scenes.length <= 1) {
              showToast('Debe quedar al menos una fotografía.');
              return;
            }
            state.scenes.splice(idx, 1);
            renderStudioScenesList();
          });

          actionsCol.appendChild(upBtn);
          actionsCol.appendChild(delBtn);

          card.appendChild(thumb);
          card.appendChild(inputsCol);
          card.appendChild(actionsCol);
          scenesEditorList.appendChild(card);
        });
      }

      const inputUploadPhotos = document.getElementById('inputUploadPhotos');
      if (inputUploadPhotos) {
        inputUploadPhotos.addEventListener('change', (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;

          const fallbacks = [
            'Un instante detenido en el tiempo.',
            'Donde nacen los mejores recuerdos.',
            'Luz, sonrisa y eternidad.',
            'Momentos que abrazan el alma.'
          ];

          if (state.scenes.every(s => s.isDefaultArt)) {
            state.scenes = [];
          }

          files.forEach((file, i) => {
            const url = URL.createObjectURL(file);
            state.scenes.push({
              src: url,
              quote: fallbacks[(state.scenes.length + i) % fallbacks.length],
              duration: 6.5,
              kenBurns: KB_MOTIONS[(state.scenes.length + i) % KB_MOTIONS.length],
              isDefaultArt: false
            });
          });

          renderStudioScenesList();
          showToast(`${files.length} foto(s) agregada(s).`);
          e.target.value = '';
        });
      }

      const inputUploadAudio = document.getElementById('inputUploadAudio');
      if (inputUploadAudio) {
        inputUploadAudio.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          audioEngine.loadCustomAudioFile(file);
          const nameEl = document.getElementById('customAudioName');
          if (nameEl) nameEl.textContent = file.name.slice(0, 22);
          showToast('Canción personalizada lista.');
        });
      }

      const btnApplyStudio = document.getElementById('btnApplyStudio');
      if (btnApplyStudio) {
        btnApplyStudio.addEventListener('click', () => {
          const titleEl = document.getElementById('inputStoryTitle');
          if (titleEl) state.storyTitle = titleEl.value.trim() || 'Recuerdos en Movimiento';
          const finEl = document.getElementById('inputFinaleMessage');
          if (finEl) state.finaleMessage = finEl.value.trim() || 'Gracias por formar parte de estos momentos inolvidables.';
          const introTitle = document.getElementById('introMainTitle');
          if (introTitle) introTitle.textContent = state.storyTitle;

          buildStageDOM();
          closeStudio();
          startExperience();
        });
      }

      function showToast(msg) {
        const toast = document.getElementById('toastNotice');
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      /* --------------------------------------------------------------------------
         9. VINCULACIÓN DE EVENTOS Y SOPORTE VISUALVIEWPORT MÓVIL
         -------------------------------------------------------------------------- */
      const btnStart = document.getElementById('btnStartExperience');
      if (btnStart) btnStart.addEventListener('click', startExperience);
      const btnReplay = document.getElementById('btnReplayExperience');
      if (btnReplay) btnReplay.addEventListener('click', startExperience);
      const btnStudioIntro = document.getElementById('btnOpenStudioIntro');
      if (btnStudioIntro) btnStudioIntro.addEventListener('click', openStudio);
      const btnStudioFinale = document.getElementById('btnOpenStudioFinale');
      if (btnStudioFinale) btnStudioFinale.addEventListener('click', openStudio);
      const btnCustomize = document.getElementById('btnCustomize');
      if (btnCustomize) btnCustomize.addEventListener('click', openStudio);
      const btnCloseStudio = document.getElementById('btnCloseStudio');
      if (btnCloseStudio) btnCloseStudio.addEventListener('click', closeStudio);

      const unlockAudio = () => {
        if (state.isPlaying && audioEngine.ctx && audioEngine.ctx.state === 'suspended') {
          audioEngine.ctx.resume().then(() => {
            if (!audioEngine.isSynthRunning && !audioEngine.usingCustomFile) {
              audioEngine.startSynth();
            }
            audioEngine.updateEqualizerUI(!state.isMuted);
          }).catch(() => { });
        }
      };
      window.addEventListener('pointerdown', unlockAudio, { once: true });
      window.addEventListener('keydown', unlockAudio, { once: true });

      document.getElementById('btnPlayPause').addEventListener('click', () => {
        if (state.isFinished) startExperience();
        else setPlayingState(!state.isPlaying);
      });

      document.getElementById('btnPrev').addEventListener('click', () => {
        if (state.isFinished) {
          document.getElementById('finaleScreen').classList.remove('visible');
          state.isFinished = false;
        }
        goToScene(state.currentIndex - 1);
      });

      document.getElementById('btnNext').addEventListener('click', () => {
        goToScene(state.currentIndex + 1);
      });

      document.getElementById('btnMute').addEventListener('click', () => {
        const nextMuted = !state.isMuted;
        audioEngine.setMuted(nextMuted);
        document.getElementById('iconVolOn').style.display = nextMuted ? 'none' : 'block';
        document.getElementById('iconVolOff').style.display = nextMuted ? 'block' : 'none';
        audioEngine.updateEqualizerUI(state.isPlaying && !nextMuted);
      });

      document.getElementById('btnFullscreen').addEventListener('click', () => {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => showToast('Vista inmersiva activa.'));
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          } else {
            showToast('Vista inmersiva activa.');
          }
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      });

      const handleViewportResize = () => {
        resizeParticlesCanvas();
        cinemaStage.querySelectorAll('.scene-layer').forEach((layer) => {
          const img = layer.querySelector('.scene-photo');
          if (img) evaluateAspectAdaptation(img, layer);
        });
      };

      window.addEventListener('resize', handleViewportResize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', handleViewportResize);
      }

      /* --------------------------------------------------------------------------
         10. INICIALIZACIÓN
         -------------------------------------------------------------------------- */
      window.addEventListener('DOMContentLoaded', () => {
        state.scenes = DEFAULT_PRESETS.map((preset) => ({
          src: preset.src || createCinematicArtwork(preset.art),
          quote: preset.quote,
          duration: preset.duration,
          kenBurns: preset.kenBurns,
          isDefaultArt: !preset.src
        }));

        buildStageDOM();
        initParticles();
        requestAnimationFrame(mainLoop);
        startExperience();
      });
    })();
  </script>
</body>
